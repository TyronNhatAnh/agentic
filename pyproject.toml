[project]
name = "agentic"
version = "0.1.0"
description = "Slack bot multi-agent orchestrator powered by Claude CLI"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20.0",
    "slack-sdk>=3.33.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "claude-agent-sdk>=0.2.87,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
agentic = "agentic.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
